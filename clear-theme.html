<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SideCut — Clear Theme & Refresh</title>
  <style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#0A1330;color:#EDECE7}</style>
</head>
<body>
  <main>
    <h1>Clearing theme data...</h1>
    <p>If this page does not redirect, please reload.</p>
  </main>
<script>
(async function(){
  try{
    // Remove theme-like localStorage keys
    try{
      const themeKeys = Object.keys(localStorage).filter(k => /theme/i.test(k));
      console.log('clear-theme: removing localStorage keys', themeKeys);
      themeKeys.forEach(k => localStorage.removeItem(k));
    }catch(e){ console.warn('clear-theme: localStorage error', e); }

    // Unregister any service workers
    try{
      if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister().catch(()=>{})));
        console.log('clear-theme: unregistered service workers');
      }
    }catch(e){ console.warn('clear-theme: sw unregister error', e); }

    // Clear caches
    try{
      if(window.caches && caches.keys){
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
        console.log('clear-theme: caches deleted', keys);
      }
    }catch(e){ console.warn('clear-theme: caches error', e); }

    // Redirect to index with cache-buster
    const url = window.location.origin + '/' + 'index.html' + '?cleared=' + Date.now();
    window.location.replace(url);
  }catch(e){ console.error('clear-theme: unexpected error', e); }
})();
</script>
</body>
</html>
