<!DOCTYPE html>
<html lang="en">
<head> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SideCut</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E1B1F" id="themeColorMeta">
<link rel="icon" href="icon-192.png" id="faviconLink">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SideCut">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg: #0A1330;
    --bg-raised: #131D45;
    --ink: #EDECE7;
    --ink-dim: #9BAAAC;
    --coral: #E3B23C;
    --gold: #4A6CF7;
    --line: rgba(237,236,231,0.09);
    --radius: 14px;
    --glow-anim-style: smooth;
    /* UI text uses the device's own system font so SideCut matches the rest of the OS,
       instead of pulling in a third-party web font. */
    --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', system-ui, sans-serif;
  }
  /* Glow style button active states */
  .glow-style-btn.active {
    background: color-mix(in srgb, var(--coral) 75%, transparent);
    border-color: var(--coral);
    color: var(--coral);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;}
  input, textarea, select{ -webkit-user-select: text; user-select: text; }
  html,body{height:100%; margin:0;}
  body{
    background: var(--bg); color: var(--ink); font-family: var(--font-ui);
    min-height:100dvh; display:flex; flex-direction:column; overflow-x:hidden;
    padding-top: env(safe-area-inset-top);
    touch-action: manipulation;
  }
  ::selection{ background: var(--coral); color:#161616; }
  h1,h2,h3{ font-family: var(--font-ui); font-weight:600; margin:0; }

  header{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px 10px; position:relative; z-index:10; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{ width:30px; height:30px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--gold), var(--coral) 70%);
    box-shadow: 0 0 0 2px var(--line); flex-shrink:0; }
  .brand h1{ font-size:19px; }
  .brand span{ display:block; font-size:11px; color:var(--ink-dim); font-family:'JetBrains Mono',monospace; letter-spacing:0.5px; }

  .action-strip{
    display:flex; gap:8px; padding: 2px 20px 14px; overflow:visible;
    position:relative; z-index:10;
  }
  .action-strip.menu-open{ z-index:300; }
  .action-strip::-webkit-scrollbar{ display:none; }
  .action-pill{
    flex-shrink:0; font-size:12.5px; font-weight:600; padding:10px 14px; border-radius:18px;
    cursor:pointer; white-space:nowrap; border:1px solid var(--line);
    background: var(--bg-raised); color: var(--ink-dim);
    transition: transform 0.1s ease, background 0.25s ease, border-color 0.25s ease;
    touch-action:manipulation; min-height:36px;
  }
  .action-pill:active{ transform: scale(0.95); }
  .action-pill{ transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), background 0.2s ease; }
  .action-pill.primary{ background: var(--coral); color:#161616; border-color:var(--coral); }
  /* The active nav pill lights up (solid accent) so it's clear which view you're in —
     same affordance as a selected tab. Home/Playlists/Discover all use it. */
  #discoverBtn.active, #libraryBtn.active, #homeBtn.active{ background: var(--coral); color:#161616; border-color:var(--coral); }

  /* ---------- Empty state ---------- */
  #emptyState{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:24px; text-align:center; }
  .disc{
    width:120px; height:120px; border-radius:50%;
    touch-action: none;
    /* #npDisc's parent (#npPlayerBody) now sets pointer-events:none to keep the 3D
       turntable wrapper out of hit-testing — see the comment there. This opts the
       disc itself back in, since it's the one part meant to be tapped. */
    pointer-events:auto;
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 32%),
      repeating-radial-gradient(circle at center, #12181a 0, #12181a 1.5px, #1b2224 1.5px, #1b2224 3px);
    border:2px solid var(--gold); position:relative;
    display:flex; align-items:center; justify-content:center;
    animation: spin 5s linear infinite; animation-play-state: paused;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.06), 0 0 0 1px color-mix(in srgb, var(--gold) 40%, transparent);
    transition: border-color 0.4s ease, box-shadow 0.4s ease;
  }
  .disc.spinning{ animation-play-state: running; }
  .disc.spinning.scratching{ animation-play-state: paused; }
  .disc::before{
    content:''; position:absolute; width:34%; height:34%; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--gold), var(--coral) 75%);
    box-shadow: 0 0 0 2px rgba(0,0,0,0.5), inset 0 0 6px rgba(0,0,0,0.25);
    z-index:1; transition: background 0.4s ease;
  }
  .disc::after{ content:''; width:9%; height:9%; border-radius:50%; background:#0A0D0E; position:relative; z-index:2;
    box-shadow: 0 0 0 1.5px var(--gold); transition: box-shadow 0.4s ease; }
  .disc-label{
    position:absolute; width:34%; height:34%; border-radius:50%; z-index:1;
    background: radial-gradient(circle at 35% 30%, var(--gold), var(--coral) 75%);
    background-size:cover; background-position:center;
    box-shadow: 0 0 0 2px rgba(0,0,0,0.5), inset 0 0 6px rgba(0,0,0,0.25);
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  /* (rest of file truncated for brevity) */
</style>
