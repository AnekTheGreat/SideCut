<!doctype html>
<!--
  The door to the web app that carries the tools.

  80.5.2 removed every place the app itself pointed at this address, so this page
  no longer introduces itself as a different build: somebody who is here arrived
  with the link, and a splash that advertises a second version is exactly what the
  app stopped doing.

  IT IS A DOOR, NOT A SECOND COPY. The app is a single 3.8 MB page, and a copy of
  it here would be a second app to keep in step with every release - so this page
  replaces itself with ../?full=1 the moment the script runs. `location.replace`
  keeps the entry out of the history, so Back from the app goes to wherever the
  reader came from instead of bouncing through this door again.

  With the script off, the link below is the same address.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07181A">
<meta name="robots" content="noindex">
<title>SideCut</title>
<meta name="description" content="SideCut — your files, no ads, ever.">
<link rel="icon" href="../icon-192.png">
<style>
  :root{ color-scheme: dark; --bg:#07181A; --bg-raised:#0E2A2C; --ink:#EAF7F4; --dim:#8FB3AE; --coral:#37E6C4; --gold:#7FD1FF; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background: radial-gradient(120% 90% at 50% 0%, #0E2A2C 0%, var(--bg) 62%) fixed;
    color:var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:28px; text-align:center;
  }
  main{ max-width:340px; }
  .disc{
    width:104px; height:104px; margin:0 auto 22px; border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, #0A1F21 0 7%, transparent 8%),
      conic-gradient(from 210deg, var(--coral), var(--gold), #2B6B77, var(--coral));
    box-shadow: 0 16px 40px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.14);
    animation: spin 9s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  h1{ font-size:26px; font-weight:650; letter-spacing:-.02em; margin:0 0 8px; }
  p{ margin:0 0 20px; font-size:13.5px; line-height:1.6; color:var(--dim); }
  .go{
    display:inline-block; padding:12px 22px; border-radius:999px;
    background:var(--coral); color:#062220; font-weight:650; font-size:14px;
    text-decoration:none; box-shadow:0 10px 26px rgba(55,230,196,.28);
  }
  .go:active{ transform:scale(.98); }
  .small{ margin:16px 0 0; font-size:11.5px; color:var(--dim); opacity:.8; }
  @media (prefers-reduced-motion: reduce){ .disc{ animation:none; } }
</style>
</head>
<body>
<main>
  <div class="disc" aria-hidden="true"></div>
  <h1>SideCut</h1>
  <p>Opening the app…</p>
  <a class="go" href="../?full=1">Open SideCut</a>
  <p class="small">Nothing happened? Tap the button. Your library is the same either way.</p>
</main>
<script>
  // Served from /full/, so ../ is the app. The hash rides along because a deep
  // link into the app can live there.
  try{ location.replace('../?full=1' + (location.hash || '')); }catch(_e){}
</script>
</body>
</html>
