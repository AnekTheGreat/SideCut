<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Check keystore (local only)</title>
<style>
  body{font-family:-apple-system,Segoe UI,sans-serif;background:#0E1B1F;color:#eef;margin:0;padding:16px;line-height:1.5}
  h1{font-size:18px;margin:0 0 4px}
  .note{font-size:12px;color:#9fb3b9;margin:0 0 16px;line-height:1.5}
  .btn{width:100%;padding:13px;font-size:15px;font-weight:600;border:none;border-radius:10px;background:#f47a55;color:#0E1B1F;margin:10px 0}
  input[type=text]{width:100%;box-sizing:border-box;padding:12px;font-size:15px;border-radius:8px;border:1px solid #2b4450;background:#13262b;color:#eef}
  input[type=file]{width:100%;box-sizing:border-box;padding:8px;font-size:14px}
  label{display:block;font-size:12px;color:#9fb3b9;margin:10px 0 4px}
  .res{margin-top:14px;font-size:13px;white-space:pre-wrap;word-break:break-word;line-height:1.5}
  .ok{color:#7fd7a0}.bad{color:#ff7d7d}.dim{color:#9fb3b9}
</style>
</head>
<body>
  <h1>Check your keystore</h1>
  <div class="note">Runs entirely on this phone — nothing is uploaded.<br>
  1) Pick your keystore file. 2) Type the password. 3) Tap Test.</div>

  <label for="file">1. Keystore file</label>
  <input type="file" id="file">
  <div class="res dim" id="meta"></div>

  <label for="pw">2. Store password to test</label>
  <input type="text" id="pw" placeholder="type the password here">
  <button class="btn" id="test">3. Test password</button>
  <div class="res" id="out"></div>

<script>
  var $f=document.getElementById('file'), $meta=document.getElementById('meta'),
      $pw=document.getElementById('pw'), $out=document.getElementById('out'),
      $test=document.getElementById('test');
  var bytes=null, type=null;

  function isJKS(b){ return b.length>8 && b[0]===0xFE && b[1]===0xED && b[2]===0xED && b[3]===0xFE; }
  function isPKCS(b){ return b.length>4 && b[0]===0x30 && ((b[1]&0x80)===0x80); }

  $f.addEventListener('change', function(){
    var f=$f.files && $f.files[0]; if(!f) return;
    $out.textContent=''; bytes=null; type=null;
    var r=new FileReader();
    r.onload=function(){
      var buf=new Uint8Array(r.result);
      bytes=buf;
      type = isJKS(buf) ? 'JKS (java keystore)' : (isPKCS(buf) ? 'PKCS#12 (.p12/.pfx)' : 'unknown');
      $meta.textContent = f.name + ' — ' + f.size + ' bytes — detected: ' + type;
    };
    r.onerror=function(){ $meta.textContent='Error reading file.'; };
    r.readAsArrayBuffer(f);
  });

  $test.addEventListener('click', async function(){
    if(!bytes){ $out.innerHTML='<span class="bad">Pick a keystore file first (step 1).</span>'; return; }
    var pw=$pw.value;
    if(!pw){ $out.innerHTML='<span class="bad">Type a store password (step 2).</span>'; return; }
    if(type==='PKCS#12 (.p12/.pfx)'){
      $out.innerHTML='<span class="dim">This is a PKCS#12 keystore. The PWA Builder "signing.keystore" is normally a JKS — if this is .p12/.pfx, also try the .keystore/.jks file. (PKCS#12 isn\'t verified here; JKS is.)</span>';
      return;
    }
    if(type!=='JKS (java keystore)'){
      $out.innerHTML='<span class="bad">Not a JKS. This may be the text "Keep this file..." note rather than the keystore binary. Pick the actual signing.keystore file.</span>';
      return;
    }
    var pwB=[];
    for(var i=0;i<pw.length;i++) pwB.push(pw.charCodeAt(i) & 0xFF);
    try {
      var region = bytes.subarray(0, bytes.length - 20);
      var hash = new Uint8Array(await crypto.subtle.digest('SHA-1', region));
      var stored = bytes.subarray(bytes.length - 20);
      var ok = true;
      for(var k=0;k<20;k++){
        if((stored[k] ^ pwB[k % pwB.length]) !== hash[k]){ ok=false; break; }
      }
      if(ok){
        $out.innerHTML='<span class="ok">✓ PASSWORD WORKS — this password opens this keystore. Use it for ANDROID_KEYSTORE_PASSWORD.</span>';
      } else {
        $out.innerHTML='<span class="bad">✗ Password does NOT open this keystore.<br>Wrong password, or this is the wrong keystore file (try any other .keystore/.jks/.p12 you have).</span>';
      }
    } catch(e){
      $out.innerHTML='<span class="bad">Browser crypto error: '+e+'<br>Open this page over https (the GitHub Pages link) so crypto is available.</span>';
    }
  });
</script>
</body>
</html>
