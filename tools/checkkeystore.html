<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Check keystore (local only)</title>
<style>
  body{font-family:-apple-system,Segoe UI,sans-serif;background:#0E1B1F;color:#eef;margin:0;padding:16px;line-height:1.5}
  h1{font-size:18px;margin:0 0 4px}
  .note{font-size:12px;color:#9fb3b9;margin-bottom:16px}
  .btn{width:100%;padding:13px;font-size:15px;font-weight:600;border:none;border-radius:10px;background:#f47a55;color:#0E1B1F;margin:10px 0}
  input[type=text]{width:100%;box-sizing:border-box;padding:12px;font-size:15px;border-radius:8px;border:1px solid #2b4450;background:#13262b;color:#eef}
  label{display:block;font-size:12px;color:#9fb3b9;margin:10px 0 4px}
  .res{margin-top:14px;font-size:13px;white-space:pre-wrap;word-break:break-word}
  .ok{color:#7fd7a0}.bad{color:#ff7d7d}.dim{color:#9fb3b9}
</style>
</head>
<body>
  <h1>Check your keystore</h1>
  <div class="note">Runs entirely on this phone — nothing is uploaded. Pick your keystore, then tap "Test password". It verifies whether a password really opens that file (JKS SHA-1 check).</div>

  <input type="file" id="file">
  <div class="res dim" id="meta"></div>

  <label for="pw">Store password to test</label>
  <input type="text" id="pw" placeholder="e.g. h3gYtWfYYz72">
  <button class="btn" id="test">Test password</button>
  <div class="res" id="out"></div>

<script>
  const $f=document.getElementById('file'), $meta=document.getElementById('meta'),
        $pw=document.getElementById('pw'), $out=document.getElementById('out'),
        $test=document.getElementById('test');
  let bytes=null, type=null;
  const isJKS=b=>b.length>8 && b[0]==0xFE&&b[1]==0xED&&b[2]==0xED&&b[3]==0xFE;
  const isPKCS=b=>b.length>4 && b[0]==0x30 && (b[1]&0x80); // ASN.1 SEQUENCE (PKCS#12)

  async function sha1(u8){ return new Uint8Array(await crypto.subtle.digest('SHA-1', u8)); }
  function b64(b){ return btoa(String.fromCharCode.apply(null,[...b])); }

  $f.addEventListener('change', () => {
    const f=$f.files && $f.files[0]; if(!f) return;
    $out.textContent=''; bytes=null; type=null;
    const r=new FileReader();
    r.onload=()=>{
      const buf=new Uint8Array(r.result);
      bytes=buf;
      type= isJKS(buf) ? 'jks' : (isPKCS(buf) ? 'p12' : 'unknown');
      $meta.textContent=`${f.name} — ${f.size} bytes — detected: ${type}`;
      $test.disabled=false;
    };
    r.onerror=()=>$meta.textContent='Error reading file';
    r.readAsArrayBuffer(f);
  });

  $test.addEventListener('click', async ()=>{
    if(!bytes){ $out.textContent='Pick a file first.'; return; }
    const pw=$pw.value;
    if(type==='p12'){
      $out.innerHTML='<span class="dim">This is a PKCS#12 keystore. The note\'s "signing.keystore" from PWA Builder is normally a JKS — if the file you picked is .p12/.pfx, pick the .keystore/.jks instead. (PKCS#12 hashing can\'t be verified in this page, but JKS can.)</span>';
      return;
    }
    if(type!=='jks'){
      $out.innerHTML='<span class="bad">Not a JKS or PKCS#12 file. This may be the text "Keep this file..." note, not the keystore binary. Pick the actual signing.keystore.</span>';
      return;
    }
    if(!pw){ $out.textContent='Enter a password to test.'; return; }
    const pwB=new TextEncoder().encode(pw);
    const region=bytes.slice(0, bytes.length-20);
    const stored=bytes.slice(bytes.length-20);
    const digest=await sha1(region);
    let ok=true;
    for(let i=0;i<20;i++){
      const xor= stored[i] ^ pwB[i % pwB.length];
      if(xor!==digest[i]) ok=false;
    }
    $out.innerHTML = ok
      ? '<span class="ok">✓ PASSWORD WORKS — this is the correct keystore+store-password pair. Use this password for ANDROID_KEYSTORE_PASSWORD.'+(pw ? '' : '')+'</span>'
      : '<span class="bad">✗ Password does NOT open this keystore. The store password is wrong, or this file is not the keystore that matches that password.</span>';
    // Also show a fingerprint hint (size + type) so they can distinguish files.
    $meta.textContent += '  |  first bytes: ' + Array.from(bytes.slice(0,4)).map(x=>x.toString(16).padStart(2,'0')).join(' ');
  });
</script>
</body>
</html>
