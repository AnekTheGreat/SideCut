name: Fix the release retarget guard (one shot)

# WHY THIS EXISTS. The 74.1.5 release failed at one step - "Retarget the two gates
# that asked the head for an older release's words" - after eight steps had already
# passed, including the proof that the checked-out tree reproduces the released bytes
# (dev/release-7415.sha256, 50 files). The step's own work was right; its GUARD was
# wrong. The guard asked `git diff --name-only` what had moved and required the answer
# to be exactly the two gates - but the tree it runs on already carries the page patch
# and every repinned gate UNCOMMITTED, so the answer was all fifty files and the guard
# failed its own release.
#
# THE FIX is in the guard itself, not in the release: it now measures what THIS STEP
# moved, by hashing the whole diff EXCLUDING the two gates before and after (that has
# to be bit-identical) and requiring both gates to differ. Applied here as an insert
# plus a replace on two anchors that exist exactly once, and the result is checked
# against the sha256 of the file the fix was validated on - so this step cannot land a
# half-patched workflow. It removes itself in the same commit; on a second run it finds
# the corrected guard already in place and does nothing, and the workflow can then be
# deleted from the Actions tab.
#
#   Run it, then dispatch the release again: GitHub -> Actions -> "Apply the page patch"
#   -> Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-page-patch
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rewrite the guard in place
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, os

          TARGET = '.github/workflows/apply-page-patch.yml'
          SELF = '.github/workflows/fix-release-guard.yml'

          # The guard, split around the two lines it brackets: A is inserted before the
          # first `python3 dev/retarget-own-7415.py`, OLD sits right after the second,
          # and B replaces it. The needles carry their indentation.
          A = base64.b64decode('').decode()
          OLD = base64.b64decode('').decode()
          B = base64.b64decode('').decode()

          MARK = "          python3 dev/retarget-own-7415.py\n"
          WANT = 'e6cac6de4d4ec78794a045e819191aa26d0e5853884c63a2ef636062879853a0'

          src = open(TARGET, encoding='utf-8').read()
          if hashlib.sha256(src.encode()).hexdigest() == WANT:
              print('the corrected guard is already in place - nothing to do')
              raise SystemExit(0)

          if src.count(MARK) != 1:
              raise SystemExit('FATAL: the retarget step appears %d times, expected 1' % src.count(MARK))
          if src.count(OLD) != 1:
              raise SystemExit('FATAL: the guard to replace appears %d times, expected 1' % src.count(OLD))

          out = src.replace(MARK, A + MARK, 1).replace(OLD, B, 1)
          got = hashlib.sha256(out.encode()).hexdigest()
          if got != WANT:
              raise SystemExit(
                  'FATAL: the patched file hashes to %s, not the validated %s - refusing to commit' % (got, WANT))

          open(TARGET, 'w', encoding='utf-8').write(out)
          os.remove(SELF)
          print('guard replaced in %s' % TARGET)
          print('sha256 %s (the file the fix was validated on)' % got)
          PY

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'SideCut release'
          git config user.email 'actions@github.com'
          git add -A
          echo '--- this commit carries ---'
          git status --porcelain
          git diff --cached --stat
          git commit -m "Make the release retarget guard measure its own step, not HEAD"
          git push
          echo '--- landed ---'
          git log --oneline -1
