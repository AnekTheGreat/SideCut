name: Land 74.5

# ONE-SHOT BRIDGE, the third release to use it. The machine that prepared 74.5 has no git
# credentials, so this workflow fetches the rehearsed bundle, proves it with the release's own
# tools, and puts it on main in one commit whose tree is the rehearsal tree. The tree hash is an
# input and the push only happens if the landed tree is that hash; the commit deletes this file,
# so nothing about the bridge stays in main's tree.
on:
  workflow_dispatch:
    inputs:
      bundle:
        description: 'the URL of the rehearsed release bundle'
        required: true
        type: string
      bundle_sha256:
        description: 'sha256 of that bundle'
        required: true
        type: string
      page_sha256:
        description: 'sha256 of index.html in the rehearsed tree'
        required: true
        type: string
      tree:
        description: 'the tree the release must land as'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: land-745
  cancel-in-progress: false

jobs:
  land:
    name: Prove the bundle, then put it on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the bundle, and check it is the rehearsed one
        run: |
          set -euo pipefail
          curl -fsSL "${{ inputs.bundle }}" -o /tmp/release.bundle
          echo "${{ inputs.bundle_sha256 }}  /tmp/release.bundle" | sha256sum -c -
          ls -l /tmp/release.bundle

      - name: Unwrap it, and check its page, its release and its own tools
        run: |
          set -euo pipefail
          git fetch /tmp/release.bundle main:release
          git checkout release
          echo "${{ inputs.page_sha256 }}  index.html" | sha256sum -c -
          grep -m1 -o "APP_VERSION = '[0-9.]*'" index.html
          python3 dev/patch-745.py --check
          node dev/repin-745.mjs --check
          node dev/ota-bundle.mjs --check
          node dev/ota-bundle-play.mjs --check

      - name: Put the release on main
        run: |
          set -euo pipefail
          git config user.name 'AnekTheGreat'
          git config user.email '166177289+AnekTheGreat@users.noreply.github.com'
          git checkout --detach origin/main
          git checkout release -- .
          git rm -q --ignore-unmatch .github/workflows/land-745.yml
          git add -A
          git status --porcelain | head -30
          git commit -q -F - <<'MSG'
          Release 74.5 - Ask SideCut, deletes that delete with an Undo, the Medium bubble size, and a pill dock that behaves like a control

          The number and the notes for the feature set rehearsed on 74.1.9, with every
          gate repinned to the new build and cache: 110 edits across 78 suites, plus the
          album-follow probe's regex pin, which the sweep cannot see.

          Ask SideCut shows a plan before it changes anything and undoes it in one tap;
          Clear playlist and Delete all songs now delete through the one in-app path;
          Home bubbles gain the middle size; the pill dock keeps its highlight under the
          finger; the 1/8 pad latches on the grid and the Beat repeat badge is earned by
          holding a pad.

          Both OTA channels rebuilt to a fixed point - 990638 and 990649 bytes - and the
          full battery run in slices: every suite green except the months-old
          media-controls-check red.

          🤖 Generated with Codebuff
          Co-Authored-By: Codebuff <noreply@codebuff.com>
          MSG
          landed=$(git rev-parse HEAD^{tree})
          if [ "$landed" != "${{ inputs.tree }}" ]; then
            echo "the landed tree is $landed, but the rehearsal tree is ${{ inputs.tree }}"
            exit 1
          fi
          git push origin HEAD:main
          echo "main is now $(git rev-parse HEAD) (tree $landed)"
