name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Publish OTA bundle for the native app
        run: |
          mkdir -p ota
          node -e "
            const fs = require('fs');
            const m = fs.readFileSync('index.html','utf8').match(/const APP_VERSION = '([^']+)'/);
            const v = m ? m[1] : '0.0.0';
            fs.writeFileSync('ota/manifest.json', JSON.stringify({ version: v, url: 'SideCut-web.zip' }));
            console.log('OTA manifest version:', v);
          "
          rm -f ota/SideCut-web.zip
          zip -q -r ota/SideCut-web.zip index.html sw.js manifest.json icon-192.png icon-512.png dev/native-updates.js
          echo '--- ota/ contents ---' && ls -la ota/
          echo '--- ota/manifest.json ---' && cat ota/manifest.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
