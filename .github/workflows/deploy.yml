name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Publish OTA bundle for the native app
        run: |
          mkdir -p ota
          rm -f ota/SideCut-web.zip ota/update.zip
          zip -q -r ota/update.zip index.html sw.js manifest.json icon-192.png icon-512.png dev/native-updates.js
          cp ota/update.zip ota/SideCut-web.zip
          # Manifest carries the real zip size (progress-bar ETA) and the real
          # patch notes (update sheet) — pulled from the in-app CHANGELOG so
          # users always see what actually changed in the version they install.
          SIZE=$(stat -c%s ota/update.zip)
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('index.html','utf8');
            const m = src.match(/const APP_VERSION = '([^']+)'/);
            const v = m ? m[1] : '0.0.0';
            const block = src.match(/const CHANGELOG = \\[([\\s\\S]*?)\\n  \\];/);
            let notes = [];
            if (block) {
              try {
                const entries = eval('[' + block[1] + ']');
                const e = entries.find(e => String(e.version) === v) || entries[0];
                if (e) {
                  notes = (e.items || []).slice(0, 6);
                  var dateField = e.date ? String(e.date) : '';
                }
              } catch (err) { console.log('changelog parse failed:', err.message); }
            }
            fs.writeFileSync('ota/updates.json', JSON.stringify({ version: v, url: 'update.zip', size: process.argv[1], notes, date: dateField || '' }));
            fs.writeFileSync('ota/manifest.json', JSON.stringify({ version: v, url: 'SideCut-web.zip', size: process.argv[1], notes, date: dateField || '' }));
            console.log('OTA manifest:', v, process.argv[1], 'bytes,', notes.length, 'notes');
          " "$SIZE"
          echo '--- ota/ contents ---' && ls -la ota/
          echo '--- ota/updates.json ---' && cat ota/updates.json
          echo '--- ota/manifest.json (legacy path) ---' && cat ota/manifest.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
