name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write   # the OTA publish step commits ota/ back to main
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Publish OTA bundle for the native app
        run: |
          # One source of truth (dev/ota-bundle.mjs) for the bundle the installed
          # app downloads: zip + manifest, both derived from index.html.
          node dev/ota-bundle.mjs
          node dev/ota-bundle-play.mjs
          echo '--- ota/ contents ---' && ls -la ota/ ota-play/
          echo '--- ota/updates.json ---' && cat ota/updates.json

      - name: Commit the published bundle
        # This repo's Pages site is in LEGACY mode (source: branch main, path /),
        # so what an installed app receives is the *committed* ota/ directory — the
        # artifact uploaded below is ignored. Without this commit the published
        # bundle silently stays behind index.html, which is how it got stuck at
        # v57.5 while the app moved on to 58.x and no update would ever install.
        continue-on-error: true   # a protected branch must not break the deploy
        run: |
          if git diff --quiet -- ota ota-play updates.json; then
            echo 'OTA bundle already current — nothing to commit.'
            exit 0
          fi
          git config user.name 'SideCut OTA'
          git config user.email 'actions@github.com'
          git add ota ota-play updates.json
          git commit -m "Publish OTA bundle $(node -p "require('./ota/updates.json').version")"
          git push

      - name: Verify the published bundle is current
        # Fails the build instead of quietly shipping an app that can never update.
        run: node dev/ota-bundle.mjs --check && node dev/ota-bundle-play.mjs --check

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
