name: Apply the page patch

# Ships 74.1.5 from inside the repository: index.html is one 3.24 MB file that cannot be
# pushed from a host with no credentials, so the release is a payload plus this workflow.
# dev/patch-7415.py edits the checked-out page (idempotent; --check says whether it is
# behind), dev/repin-7415.mjs moves the gate pins, and the result is proven against
# dev/release-7415.sha256 byte for byte before a line is committed.
#
# THIS FILE IS DELIBERATELY THIN. GitHub refuses any commit that touches
# `.github/workflows/` from a workflow, so it can only be edited by hand, in one API call
# that carries every byte of it: its prose lives in dev/release-7415-entry.md and its
# battery and AGENTS.md insert live in dev/ scripts. Dispatched by hand; a second run
# finds no payload and does nothing.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-page-patch
  cancel-in-progress: false

jobs:
  release:
    name: Apply 74.1.5, gate it, commit it
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 24, not 20. This battery boots ONE 3.24 MB index.html in jsdom and then waits a
          # fixed number of milliseconds for the page to define its contents. On Node 20 that
          # boot outruns the guess: document.readyState reaches 'complete' - the moment the
          # page's globals appear - at 11.2 s, while crossfade-pause-check waits 3.5 s and
          # media-controls-check reads the page sooner still, so crossfade, compress-library,
          # refresh-pin, audio-focus, background-playback and the whole OTA trio go red on
          # state the page has simply not defined yet. On 24 the same boot finishes inside
          # every settle: the same suites, on the same machine, run one after the other, are
          # red on 20 and green on 24. The release battery runs on the Node it is verified on.
          node-version: 24

      - name: Is the payload still here?
        id: payload
        run: |
          if [ -f dev/7415-payload.tar.xz.b64 ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo '::notice::The 74.1.5 payload has already been consumed and committed.'
          fi

      - name: Unpack the release tools and prove the payload is intact
        if: steps.payload.outputs.present == 'yes'
        run: |
          set -euo pipefail
          # Checked with its line breaks stripped: the file's own formatting can never
          # decide whether a release runs.
          tr -d '\n\r' < dev/7415-payload.tar.xz.b64 > /tmp/payload.b64
          echo '8306b07609074b572377cf2dc87a1685a2464ec8cc04db94436892097405db0a  /tmp/payload.b64' > /tmp/payload.sha
          sha256sum -c /tmp/payload.sha
          base64 -d /tmp/payload.b64 > /tmp/payload.tar.xz
          tar -xJf /tmp/payload.tar.xz
          rm -f dev/7415-payload.tar.xz.b64
          # The two tools that came out are the two that were rehearsed.
          sha256sum -c - <<'SUMS'
          a0b5b153c5bfd8c0f9388e91fc9ebd171ec034652c1ad3ffacbb673fae4770f2  dev/patch-7415.py
          08faca9d9ff71f170131e4019b6f75140793cfd68ddd477fa1d34161c5ed041a  dev/repin-7415.mjs
          SUMS

      - name: Apply the page patch
        if: steps.payload.outputs.present == 'yes'
        run: python3 dev/patch-7415.py

      - name: Repin the gates
        if: steps.payload.outputs.present == 'yes'
        run: node dev/repin-7415.mjs

      - name: Prove the tree reproduces the released bytes
        # Not "does the diff look right" but "does running it reproduce the tested tree".
        if: steps.payload.outputs.present == 'yes'
        run: |
          set -euo pipefail
          sha256sum -c dev/release-7415.sha256
          python3 dev/patch-7415.py --check
          node dev/repin-7415.mjs --check

      - name: Retarget the two gates that asked the head for an older release's words
        if: steps.payload.outputs.present == 'yes'
        run: |
          set -euo pipefail
          # Only these two may move, and both must. The tree already carries the page patch
          # and every repinned gate UNCOMMITTED, so "what moved" cannot be read off `git diff`
          # against HEAD - it is measured against the state this step started in. The first
          # run of this release failed here, after steps 1-8 had all passed.
          rest() { git diff -- . ':(exclude)dev/test-740.mjs' ':(exclude)dev/test-741.mjs' | sha256sum | cut -d' ' -f1; }
          one() { sha256sum "$1" | cut -d' ' -f1; }
          rest_before=$(rest); g740_before=$(one dev/test-740.mjs); g741_before=$(one dev/test-741.mjs)

          python3 dev/retarget-own-7415.py
          python3 dev/retarget-own-7415.py --check

          rest_after=$(rest); g740_after=$(one dev/test-740.mjs); g741_after=$(one dev/test-741.mjs)
          fail=''
          add() { fail="${fail:+$fail; }$1"; }
          [ "$rest_before" = "$rest_after" ] || add 'the retarget changed a file other than the two gates'
          [ "$g740_before" != "$g740_after" ] || add 'dev/test-740.mjs did not move'
          [ "$g741_before" != "$g741_after" ] || add 'dev/test-741.mjs did not move'
          if [ -n "$fail" ]; then echo "::error::$fail"; exit 1; fi
          echo 'retarget: only the two gates moved, and both moved.'

      - name: Rebuild the OTA bundles to a true fixed point
        # BEFORE the battery, not after it. dev/ota-update-check.cjs asserts the tree's own
        # bundle - ota/updates.json and the index.html inside ota/update.zip - is already on
        # index.html's APP_VERSION, and that a second generation produces the same bytes.
        # Rebuilding after the battery therefore ran that suite against the PREVIOUS
        # release's bundle, on purpose-patched 74.1.5 page: every run of this release died
        # on exactly ota-update-check, "manifest v74.1 vs APP_VERSION v74.1.5", and passed
        # 52/0 when re-run on its own, because that suite regenerates the bundle itself and
        # so leaves the tree fixed for the next reader. The battery has to measure the tree
        # that gets committed, so the bundles exist before it runs.
        #
        # The zip embeds the root manifest.json, and that manifest records the zip's own
        # size - so each pass publishes the size the last one measured and rebuilds until
        # both --checks pass; the --checks after the loop fail the step if it never does.
        if: steps.payload.outputs.present == 'yes'
        run: |
          set -euo pipefail
          for pass in 1 2 3 4 5 6; do
            cp updates.json manifest.json
            node dev/ota-bundle.mjs
            node dev/ota-bundle-play.mjs
            if node dev/ota-bundle.mjs --check > /dev/null 2>&1 && node dev/ota-bundle-play.mjs --check > /dev/null 2>&1; then
              echo "OTA: fixed point reached on pass $pass"
              break
            fi
          done
          cp updates.json manifest.json
          node dev/ota-bundle.mjs --check
          node dev/ota-bundle-play.mjs --check
          node -p "JSON.stringify(require('./ota/updates.json'), null, 1)"
          for f in ota/update.zip ota-play/update.zip ota/SideCut-web.zip; do
            printf '%s %s bytes\n' "$f" "$(stat -c%s "$f")"
          done

      - name: Gates
        # Installs what the battery reads, runs dev/gates.sh, and permits the one red this
        # repo has recorded for months (media-controls-check, 66/1).
        if: steps.payload.outputs.present == 'yes'
        run: sh dev/release-7415-gates.sh

      - name: Record the release in AGENTS.md
        if: steps.payload.outputs.present == 'yes'
        run: python3 dev/release-7415-record.py

      - name: Commit and push
        if: steps.payload.outputs.present == 'yes'
        run: |
          set -euo pipefail
          git config user.name 'SideCut release'
          git config user.email 'actions@github.com'
          git add -A
          git status --porcelain
          # NOT .github/: a workflow file is refused by the Actions token ("without
          # 'workflows' permission"), so a release that would commit one can only fail.
          stray=$(git status --porcelain | awk '{print $NF}' | grep -vE '^(dev/|ota/|ota-play/|index\.html$|sw\.js$|manifest\.json$|updates\.json$|AGENTS\.md$)' || true)
          if [ -n "$stray" ]; then
            echo "::error::unexpected path(s) in the release commit: $stray"
            exit 1
          fi
          git commit -m "Release 74.1.5 - an artist's songs open from the home bubble, and the storage cleaner sizes every track in MB"
          git push
          echo '--- landed ---'
          git log --oneline -1
