name: Release from a payload

# A release is a payload plus this workflow.
#
# index.html is ONE 3.4 MB file, and the machine that prepares a release has no git
# credentials and cannot push a file that size - the API carries whole files as call
# arguments, at any encoding. So the page ships by being EDITED inside the
# repository: the release pushes dev/patch-<version>.py (the page edits, idempotent),
# this workflow runs it over the checked-out tree, rebuilds the OTA bundles, records
# the release in AGENTS.md, and commits.
#
# NO GATES AND NO BATTERY. dev/gates.sh, dev/release-gates.sh, the per-release
# *-check.cjs / test-*.mjs suites, the repins, the gate blocks and the tree proofs
# were retired in 80.2.8: they cost ten to fifty minutes on every release and never
# once caught a page that would have shipped anyway. What is left are the checks this
# file can make in seconds and that guard something real:
#
#   - the payload applies, and re-running it changes nothing (--check);
#   - the OTA bundles reach a true fixed point (deploy.yml depends on them);
#   - the commit carries nothing outside the paths a release owns.
#
# If a release needs a behaviour verified, verify it in the session that writes the
# patch, on the page as it is, and say what was run. Do not rebuild the battery here.
#
# THIS FILE IS DELIBERATELY THIN. GitHub refuses any commit that touches
# `.github/workflows/` from an Actions token, so it can only be edited with a
# credential that carries the `workflows` permission: the AGENTS.md insert lives in
# dev/release-record.py and the prose in dev/release-entry.md, both of which an
# ordinary commit can carry. Dispatched by hand with the version it ships; a second
# dispatch for the same version finds the page already patched and does nothing.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The release this payload ships, e.g. 80.2.8'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Apply the payload, commit it
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Is a release pending, and is its payload here?
        id: pending
        run: |
          set -euo pipefail
          V='${{ inputs.version }}'
          # The release's ID as its own files are named: the tools drop the dots.
          N=$(printf '%s' "$V" | tr -d '.')
          for f in "dev/patch-$N.py" "dev/release-entry.md" "dev/release-record.py"; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing, so $V cannot be released from this tree"
              exit 1
            fi
          done
          if python3 "dev/patch-$N.py" --check > /dev/null 2>&1; then
            echo "pending=no" >> "$GITHUB_OUTPUT"
            echo "::notice::$V is already on the checked-out page - nothing to do."
          else
            echo "pending=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply the page patch
        if: steps.pending.outputs.pending == 'yes'
        run: |
          set -euo pipefail
          N=$(printf '%s' '${{ inputs.version }}' | tr -d '.')
          python3 "dev/patch-$N.py"
          # Idempotent by contract: a second run over the patched page is a no-op.
          python3 "dev/patch-$N.py" --check

      - name: Rebuild the OTA bundles to a true fixed point
        # The zip embeds the root manifest.json, and that manifest records the zip's
        # own size - so each pass publishes the size the last one measured and
        # rebuilds until both --checks pass; the --checks after the loop fail the
        # step if it never does. deploy.yml rebuilds them too, but the bundle a
        # release commits has to be settled in the same commit as the page.
        if: steps.pending.outputs.pending == 'yes'
        run: |
          set -euo pipefail
          for pass in 1 2 3 4 5 6; do
            cp updates.json manifest.json
            node dev/ota-bundle.mjs
            node dev/ota-bundle-play.mjs
            if node dev/ota-bundle.mjs --check > /dev/null 2>&1 && node dev/ota-bundle-play.mjs --check > /dev/null 2>&1; then
              echo "OTA: fixed point reached on pass $pass"
              break
            fi
          done
          cp updates.json manifest.json
          node dev/ota-bundle.mjs --check
          node dev/ota-bundle-play.mjs --check
          node -p "JSON.stringify(require('./ota/updates.json'), null, 1)"
          for f in ota/update.zip ota-play/update.zip ota/SideCut-web.zip; do
            printf '%s %s bytes\n' "$f" "$(stat -c%s "$f")"
          done

      - name: Record the release in AGENTS.md
        if: steps.pending.outputs.pending == 'yes'
        run: python3 dev/release-record.py

      - name: Commit and push
        if: steps.pending.outputs.pending == 'yes'
        run: |
          set -euo pipefail
          V='${{ inputs.version }}'
          git config user.name 'SideCut release'
          git config user.email 'actions@github.com'
          git add -A
          git status --porcelain
          # NOT .github/: a workflow file is refused by the Actions token ("without
          # 'workflows' permission"), so a release that would commit one can only
          # fail at the last step.
          stray=$(git status --porcelain | awk '{print $NF}' | grep -vE '^(dev/|ota/|ota-play/|index\.html$|sw\.js$|manifest\.json$|updates\.json$|AGENTS\.md$)' || true)
          if [ -n "$stray" ]; then
            echo "::error::unexpected path(s) in the release commit: $stray"
            exit 1
          fi
          TITLE=$(grep -oE "\{ version: '$V', date: '[^']*', title: '[^']*'" index.html | head -1 | sed -E "s/.*title: '//; s/'$//")
          [ -n "$TITLE" ] || TITLE="$V"
          git commit -m "Release $V - $TITLE"
          git push
          echo '--- landed ---'
          git log --oneline -1
