name: Land the version-code note

# One dispatch: writes the version-code section into AGENTS.md, commits it, and deletes the
# fixer. AGENTS.md is 950 KB and does not fit through the contents API, so the section travels
# as an insertion against the checked-out file (dev/patch-android-version-code.py).
#
# Nothing else is touched here, and nothing else can be: `workflows` is not a GITHUB_TOKEN
# scope, so a commit that edits a workflow file is refused at the push - which is exactly how
# the first version of this run failed, before it was cut down to AGENTS.md alone.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version-code-note
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write the section into AGENTS.md
        run: |
          set -euo pipefail
          python3 dev/patch-android-version-code.py
          head -3 AGENTS.md

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'SideCut release'
          git config user.email 'actions@github.com'
          git rm -q dev/patch-android-version-code.py
          git add AGENTS.md
          git status --porcelain
          # This run exists to land one file and delete one; anything else in the commit is a
          # runner side effect and must fail the run instead of being swept in.
          stray=$(git diff --cached --name-only | grep -v -E '^(AGENTS\.md|dev/patch-android-version-code\.py)$' || true)
          if [ -n "$stray" ]; then
            echo "::error::unexpected path(s) in this commit: $stray"
            exit 1
          fi
          git commit -m 'Record why the Play version code moved from a pin to the build run' -m 'The 5.0.55 bundle uploaded on 25 October and the one rebuilt after 80.3 / 80.3.1 both carried 512000, from an androidVersionCode pin nobody bumped, and Play refused the second. The number patch-version.py now derives from the run cannot repeat.'
          git push
          echo '--- landed ---'
          git log --oneline -1

      - name: Prove the landed tree says this
        run: |
          set -euo pipefail
          test ! -e dev/patch-android-version-code.py
          grep -c '## The Android version code (October 26, 2026)' AGENTS.md
          python3 dev/version-code-check.py | tail -2
