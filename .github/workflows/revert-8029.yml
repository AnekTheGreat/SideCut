name: Remove the 80.2.9 picture release

# One-off. 80.2.9 shipped a picture-picker change to the wrong repository: it was
# asked for in FamTM, not SideCut. The session that built it has no git credential
# and cannot push a 3.4 MB single-line index.html through the API, so the removal
# travels as a revert on the runner, the way every release here travels as a patch.
#
# It reverts the four commits that mistake produced, newest first:
#   02a834e  the check that proved any format reaches a cover
#   5abb84d  the release commit: page, manifests, OTA bundles, AGENTS.md record
#   171c896  the page patch script
#   65c98f9  the release entry
#
# It leaves the versionCode pin (bba4284, 9a1c87b) alone. That fix is wanted: it is
# the answer to "Version code 511722 has already been used".
#
# A second dispatch finds the page already clean and changes nothing.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: revert-8029
  cancel-in-progress: false

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Revert the 80.2.9 commits
        run: |
          set -euo pipefail
          git config user.name "SideCut release"
          git config user.email "actions@github.com"
          if ! grep -q "scPicCoverFromFile" index.html; then
            echo "the page no longer carries the picture change - nothing to revert"
            exit 0
          fi
          for c in 02a834eeccaf7cd032e903e9c30f83e84d53f2e2 \
                   5abb84d301cb2f17714905c4d5f707252b42f681 \
                   171c89694afcc9412497b76ce14d548eb83d12d2 \
                   65c98f90cc65d1f3776bcc258ffbb9d39eab40b8; do
            git revert --no-edit "$c"
          done

      - name: Prove the tree is the one 80.2.9 found
        run: |
          set -euo pipefail
          if grep -q "scPicCoverFromFile" index.html; then
            echo "FAIL: the picture change is still on the page"
            exit 1
          fi
          echo "ok: no picture change on the page"
          v=$(python3 -c 'import json;print(json.load(open("updates.json"))["version"])')
          if [ "$v" != "80.2.8" ]; then
            echo "FAIL: updates.json says $v, not 80.2.8"
            exit 1
          fi
          echo "ok: the feed is 80.2.8"
          # The only path this run adds is this workflow file, which is deleted as
          # soon as the run is green; everything else must be the pre-80.2.9 tree.
          if ! git diff --quiet 9a1c87b HEAD -- . ':(exclude).github/workflows/revert-8029.yml'; then
            echo "FAIL: the tree is not the pre-80.2.9 tree"
            git diff --stat 9a1c87b HEAD -- . ':(exclude).github/workflows/revert-8029.yml'
            exit 1
          fi
          echo "ok: the tree is 9a1c87b, apart from this scaffolding"

      - name: Push
        run: git push origin HEAD:main
