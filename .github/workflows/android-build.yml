name: Build Android (Capacitor) AAB

# Builds a signed SideCut Android app (WebView, NOT a TWA) entirely in the cloud.
# Result: a downloadable .aab you upload to Play Console. No Android Studio needed.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Set up JDK (for Gradle + keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      # ---- Stage the static web app into what Capacitor calls its webDir ----
      - name: Stage web assets into www/
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/index.html
          cp sw.js www/sw.js 2>/dev/null || true
          cp manifest.json www/manifest.json 2>/dev/null || true
          cp icon-192.png www/icon-192.png 2>/dev/null || true
          cp icon-512.png www/icon-512.png 2>/dev/null || true

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into the Android project
        run: npx cap sync android

      # ---- Signing: generated keystore (after Play upload-key reset) ----
      # The pipeline generates its OWN keystore, cached so the same key is reused
      # on every build. After ONE Play Console upload-key reset, Play accepts it
      # and every future build signs cleanly. No keystore secrets to manage.
      # If you still want to sign with your real Play upload keystore instead,
      # switch ANDROID_SIGNING_MODE to "secret" below and set the 4 repo secrets.
      - name: Cache the generated signing keystore
        uses: actions/cache@v4
        with:
          path: sidecut-upload.jks
          key: sidecut-generated-key-v1

      - name: Wire signing into the Android Gradle config
        run: python3 .github/workflows/patch-signing.py
        env:
          ANDROID_SIGNING_MODE: generated

      # Independent sanity check of the keystore via Java's keytool (works in
      # both signing modes). Confirms the alias Gradle will look up actually
      # exists inside the store.
      - name: Verify keystore with keytool
        run: |
          set +e
          echo "--- keytool -list ---"
          keytool -list -keystore sidecut-upload.jks -storepass "SideCut-Upload-Key-2026!Gen" -storetype PKCS12 2>&1 | head -30
          echo "--- done ---"

      # Export the upload-key CERTIFICATE (PEM) from the generated keystore so
      # the owner can register it in Play Console's App signing -> reset upload
      # key screen (that screen needs a .pem certificate, NOT the .aab).
      - name: Export upload certificate (PEM)
        run: |
          keytool -export -rfc \
            -keystore sidecut-upload.jks \
            -storepass "SideCut-Upload-Key-2026!Gen" \
            -alias sidecut \
            -file upload_certificate.pem
          echo "certificate exported:"; head -1 upload_certificate.pem
          mv upload_certificate.pem android/app/build/outputs/bundle/release/ 2>/dev/null || { cp upload_certificate.pem android/app/build/outputs/bundle/release/ 2>/dev/null || mv upload_certificate.pem .; }

      # ---------------- Real build ---------------
      - name: Build release AAB
        run: cd android && chmod +x gradlew && ./gradlew bundleRelease --no-daemon

      - name: Upload AAB + certificate
        uses: actions/upload-artifact@v4
        with:
          name: SideCut-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            upload_certificate.pem
          if-no-files-found: error