name: Build Android (Capacitor) AAB

# Builds a signed SideCut Android app (WebView, NOT a TWA) entirely in the cloud.
# Result: a downloadable .aab you upload to Play Console. No Android Studio needed.
on:
  # On demand only. A push to main publishes the OTA bundle (deploy.yml) and starts
  # nothing else: the installed app picks the new bundle up over the air, so the
  # signed AAB/APK does not have to be rebuilt and re-released for every change.
  # Run this workflow (Actions -> Build Android -> Run workflow) when an APK/AAB is
  # actually wanted, e.g. for a Play upload or a fresh sideload.
  workflow_dispatch:

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The release step at the bottom attaches every built APK and AAB to a GitHub
    # release. A workflow artifact has no download counter of any kind, so a
    # release asset is the only place the count exists - which is what the app's
    # APK downloads panel reads.
    permissions:
      contents: write
    strategy:
      # Two flavors from one pipeline:
      #   play - Play flag injected (licensed sources, ota-play channel) -> upload AAB to Play
      #   full - no flag: the complete build, sideloaded only -> full ota/ updates
      matrix:
        flavor: [play, full]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - name: Set up JDK (for Gradle + keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        run: npm install
      - name: Stage web assets into www/
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/index.html
          cp sw.js www/sw.js 2>/dev/null || true
          cp manifest.json www/manifest.json 2>/dev/null || true
          cp icon-192.png www/icon-192.png 2>/dev/null || true
          cp icon-512.png www/icon-512.png 2>/dev/null || true
          mkdir -p www/dev
          cp dev/native-updates.js www/dev/native-updates.js
      - name: Inject the Play build flag (licensed sources, play OTA channel)
        # Play flavor only: must run before cap sync so the AAB's web bundle
        # carries the flag (licensed acquisition, YouTube card hidden, ota-play/).
        if: matrix.flavor == 'play'
        run: python3 .github/workflows/patch-playbuild.py
      - name: Patch native Play Billing web bridge
        run: python3 .github/workflows/patch-billing.py
      - name: Add Android platform
        run: npx cap add android
      - name: Sync web assets into the Android project
        run: npx cap sync android
      - name: Give the sideloaded build its own app identity (full flavor only)
        # Both flavors used to ship applicationId com.SideCut.myapp, so Android saw
        # them as one app and installing either replaced the other. The full build
        # is sideloaded only, so it takes the ".full" id and the "SideCut Full"
        # label: the two can now be installed side by side. The Play build keeps
        # the id its listing is bound to, because moving THAT would publish a new
        # app and existing Play users would stop getting updates.
        if: matrix.flavor == 'full'
        run: python3 .github/workflows/patch-dualinstall.py
      - name: Patch Android manifest permissions for the media notification
        run: python3 .github/workflows/patch-manifest.py
      - name: Enable Android Auto Backup
        run: python3 .github/workflows/patch-backup.py
      - name: Harden media-session plugin against onStartCommand NPE
        run: python3 .github/workflows/patch-mediaplugin.py
      - name: Inject the SideCut home-screen widget
        run: python3 .github/workflows/patch-widget.py
      - name: Inject the audio-focus plugin (calls / headset takeovers)
        run: python3 .github/workflows/patch-audiofocus.py
      - name: Inject the conversion job hold (wake lock + dataSync foreground service)
        # The native half of "a conversion keeps going in the background": with the
        # screen off Android suspends the app, and a suspended app does not download.
        # Deeper note in patch-joblock.py.
        run: python3 .github/workflows/patch-joblock.py
      - name: Wire the developer keystore into the Android Gradle config
        run: python3 .github/workflows/patch-signing.py
        env:
          ANDROID_SIGNING_MODE: secret
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      - name: Verify keystore with keytool
        run: |
          set +e
          keytool -list -keystore sidecut-upload.jks \
            -storepass "$(grep '^storePassword=' android/keystore.properties | cut -d= -f2)" \
            -storetype "$(grep '^storeType=' android/keystore.properties | cut -d= -f2)" 2>&1 | head -30
      - name: Export upload certificate (PEM)
        run: |
          keytool -export -rfc \
            -keystore sidecut-upload.jks \
            -storepass "$(grep '^storePassword=' android/keystore.properties | cut -d= -f2)" \
            -alias "$(grep '^keyAlias=' android/keystore.properties | cut -d= -f2)" \
            -file upload_certificate.pem
          head -1 upload_certificate.pem
      - name: Bump Android version from package.json
        run: python3 .github/workflows/patch-version.py
      - name: Bump Android SDK to API 36
        run: python3 .github/workflows/patch-sdk.py
      - name: Replace default launcher icons with SideCut branding
        run: python3 .github/workflows/patch-icons.py
      - name: Build release AAB
        run: cd android && chmod +x gradlew && ./gradlew bundleRelease --no-daemon
      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Verify the built artifacts declare target API 36 and minSdk 24
        # The SDK numbers are a patch applied to a template Capacitor regenerates on
        # every build, so the only proof they took is the manifest INSIDE the files
        # that get uploaded. Play has refused this app once for each number: an AAB
        # targeting less than 36, and SideCut-5.0.53-release.aab below minSdk 24
        # ("Play automatic protection requires a minimum SDK version of 24 or higher").
        # Failing here says so in the run's own log instead of in the console a day
        # later.
        run: |
          # No `set -e`: every value is printed and every check reports itself. A step
          # that dies on an empty variable leaves a red run with no reason in it, and
          # the reason is the whole point.
          set -uo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          TOOLS=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          STATUS=0
          BADGING=$("${TOOLS:-/nonexistent}/aapt2" dump badging "$APK" 2>&1) || {
            echo "::error::aapt2 could not read the APK (TOOLS='${TOOLS:-}'): $BADGING"
            STATUS=1
          }
          # Anchored at the line start so the floor cannot pick up targetSdkVersion, and
          # read under both spellings: aapt2 prints `sdkVersion:'24'` in some build-tools
          # releases and `minSdkVersion:'24'` in others, and the case differs, so neither
          # pattern covers the other.
          sdk() { printf '%s\n' "$BADGING" | sed -n "s/^$1:'\([0-9]\{1,3\}\)'.*/\1/p" | head -1; }
          MINSDK=$(sdk sdkVersion)
          [ -n "$MINSDK" ] || MINSDK=$(sdk minSdkVersion)
          TARGET=$(sdk targetSdkVersion)
          COMPILE=$(printf '%s\n' "$BADGING" | sed -n "s/.*compileSdkVersion='\([0-9]\{1,3\}\)'.*/\1/p" | head -1)
          SDKLINES=$(printf '%s\n' "$BADGING" | grep -i sdk | paste -sd' ' -)
          echo "built APK: minSdkVersion=${MINSDK:-none} targetSdkVersion=${TARGET:-none} compileSdkVersion=${COMPILE:-none} (aapt2 ${TOOLS:-none})"
          if [ "${TARGET:-0}" -lt 36 ]; then
            echo "::error::the APK targets ${TARGET:-nothing} - Play needs API 36 or higher (saw: ${SDKLINES:-nothing})"
            STATUS=1
          fi
          if [ "${MINSDK:-0}" -lt 24 ]; then
            echo "::error::the APK has minSdkVersion ${MINSDK:-nothing} - Play needs 24 or higher (saw: ${SDKLINES:-nothing})"
            STATUS=1
          fi
          # The AAB is what Play scans; dev/aab-sdk.py reads its protobuf manifest.
          python3 dev/aab-sdk.py "$AAB" --min 24 --target 36 || STATUS=1
          exit $STATUS
      - name: Compute version and rename AAB
        id: ver
        run: |
          V="$(node -p "require('./package.json').version")"
          S="${{ matrix.flavor == 'play' && 'release' || 'full' }}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "suffix=$S" >> "$GITHUB_OUTPUT"
          # Flavor goes in the FILENAME too: both matrix jobs produce an
          # identically-named SideCut-$V.apk, so extracting both artifacts into
          # one folder silently overwrites — and installing the release APK
          # while believing it is the full one hides the YouTube converter and
          # sends Spotify to licensed-only search (reported as "converters
          # broken on the full apk").
          cp android/app/build/outputs/bundle/release/app-release.aab "SideCut-$V-$S.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "SideCut-$V-$S.apk"
      - name: Upload AAB + certificate
        uses: actions/upload-artifact@v4
        with:
          name: SideCut-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.suffix }}
          path: |
            SideCut-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.suffix }}.aab
            SideCut-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.suffix }}.apk
            upload_certificate.pem
          if-no-files-found: error

      - name: Publish the APK as a release asset (this is what can be counted)
        # WHY A RELEASE AS WELL AS AN ARTIFACT. "Artifact" downloads cannot be
        # counted: the API does not report a count for them and they expire. A
        # RELEASE ASSET does report one (`download_count`), it is public, it does
        # not expire, and the app's Studio panel reads it straight from
        # api.github.com - so the same file is published twice, on purpose.
        #
        # One tag per flavor, because both matrix jobs run at the same time and
        # two jobs creating the same release race each other; a tag of its own is
        # the only shape that is safe with a matrix. `--clobber` makes a re-run of
        # the same version replace the files instead of failing on them.
        #
        # Tagged with the APP's version (index.html's APP_VERSION) and the flavor,
        # and NOT with package.json's - which is what the file names carry because
        # that is what the Android build numbers itself from. The tag has to move
        # with the app, not with the Android shell: two pushes can share a
        # package.json version, and a release whose asset is replaced by --clobber
        # starts its download count again from zero. One release per app version
        # per flavor is what makes the total add up, and the flavor in the tag keeps
        # a sideloaded full APK and the Play APK apart in the asset list.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          V="${{ steps.ver.outputs.version }}"
          S="${{ steps.ver.outputs.suffix }}"
          APPV="$(node -p "require('fs').readFileSync('index.html','utf8').match(/const APP_VERSION = '([^']+)'/)[1]")"
          TAG="apk-$APPV-$S"
          echo "app version $APPV, android version $V, flavor $S -> release $TAG"
          gh release view "$TAG" --json tagName >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "SideCut $APPV ($S APK)" \
              --notes "Signed Android build of SideCut $APPV, $S flavor (Android build $V). The app itself updates over the air once installed; this is the installable file. The download count on this page is what the Studio reads under APK downloads." \
              --prerelease
          gh release upload "$TAG" "SideCut-$V-$S.apk" --clobber
          gh release upload "$TAG" "SideCut-$V-$S.aab" --clobber
          gh release upload "$TAG" upload_certificate.pem --clobber
          # `set +e` is above so that the create-or-update dance cannot fail the
          # build on a release that already exists - but the whole POINT of this
          # step is that the count exists, and an upload that silently did nothing
          # would leave Studio reading a number that is never going to move. So the
          # assets are listed and checked by name, and a missing one fails here.
          gh release view "$TAG" --json assets -q '.assets[].name' | sort
          for f in "SideCut-$V-$S.apk" "SideCut-$V-$S.aab"; do
            gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx "$f" || {
              echo "::error::$f did not reach release $TAG, so its download count cannot be tracked"
              exit 1
            }
          done
