name: Build Android (Capacitor) AAB

# Builds a signed SideCut Android app (WebView, NOT a TWA) entirely in the cloud.
# Result: a downloadable .aab you upload to Play Console. No Android Studio needed.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Set up JDK (for Gradle + keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      # ---- Stage the static web app into what Capacitor calls its webDir ----
      - name: Stage web assets into www/
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/index.html
          cp sw.js www/sw.js 2>/dev/null || true
          cp manifest.json www/manifest.json 2>/dev/null || true
          cp icon-192.png www/icon-192.png 2>/dev/null || true
          cp icon-512.png www/icon-512.png 2>/dev/null || true

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into the Android project
        run: npx cap sync android

      # ---- Signing with the REAL upload keystore ----
      # The keystore (base64) + its passwords/alias are stored as GitHub repo
      # secrets and injected here, so the app is signed with the same key Play
      # already knows. Keystore material is NEVER stored in the repo.
      - name: Wire the developer keystore into the Android Gradle config
        run: python3 .github/workflows/patch-signing.py
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      # Diagnose the keystore independently of Gradle: keytool will show whether
      # the store password opens it and list the actual alias(es). If the alias
      # secret doesn't match what's inside, users see it here instead of a vague
      # 'keystore password was incorrect' from Gradle.
      - name: Verify keystore with keytool
        run: |
          set +e
          echo "--- keytool -list (store password check) ---"
          keytool -list -keystore sidecut-upload.jks -storepass "$LOOP_SECRET" \
            ${KEYSTORE_TYPE_FLAG} 2>&1 | sed 's/Password is entered/ok/' | head -30
          echo "--- exit: $? ---"
        env:
          LOOP_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_TYPE_FLAG: "-storetype PKCS12"

      # ---------------- Real build ---------------
      - name: Build release AAB
        run: cd android && chmod +x gradlew && ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideCut-release
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error