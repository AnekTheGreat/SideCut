name: Build Android (Capacitor) AAB

# Builds a signed SideCut Android app (WebView, NOT a TWA) entirely in the cloud.
# Result: a downloadable .aab you upload to Play Console. No Android Studio needed.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Set up JDK (for Gradle + keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      # ---- Stage the static web app into what Capacitor calls its webDir ----
      - name: Stage web assets into www/
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/index.html
          cp sw.js www/sw.js 2>/dev/null || true
          cp manifest.json www/manifest.json 2>/dev/null || true
          cp icon-192.png www/icon-192.png 2>/dev/null || true
          cp icon-512.png www/icon-512.png 2>/dev/null || true

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into the Android project
        run: npx cap sync android

      # ---- Signing with the REAL Play upload keystore ----
      # The keystore (base64) + passwords/alias come from GitHub repo secrets.
      # Keystore material is NEVER stored in the repo.
      - name: Wire the developer keystore into the Android Gradle config
        run: python3 .github/workflows/patch-signing.py
        env:
          ANDROID_SIGNING_MODE: secret
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      # Independent sanity check of the keystore via Java's keytool, using the
      # store password from the secret — confirms the corrected password opens
      # the real keystore before Gradle runs.
      - name: Verify keystore with keytool
        run: |
          set +e
          echo "--- keytool -list ---"
          keytool -list -keystore sidecut-upload.jks -storepass "$PASS" -storetype PKCS12 2>&1 | head -30
          echo "--- done ---"
        env:
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      # ---------------- Real build ---------------
      - name: Build release AAB
        run: cd android && chmod +x gradlew && ./gradlew bundleRelease --no-daemon

      - name: Upload AAB + certificate
        uses: actions/upload-artifact@v4
        with:
          name: SideCut-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            upload_certificate.pem
          if-no-files-found: error