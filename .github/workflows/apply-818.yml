name: apply 81.8

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply the patch
        run: python3 dev/patch-818.py

      - name: The page must still parse
        run: |
          python3 - <<'PY'
          import io, re
          h = io.open('index.html', encoding='utf-8').read()
          for marker in ('scSongSpeed', 'cropWireTools', 'scSpeedChipAttach', 'cropTools', 'cropStartIn'):
              if marker not in h:
                  raise SystemExit('missing marker: ' + marker)
          blocks = re.findall(r'<script[^>]*>(.*?)</script>', h, re.S)
          io.open('/tmp/page.js', 'w', encoding='utf-8').write(chr(10).join(blocks))
          print('markers present in', len(blocks), 'script blocks')
          PY
          node --check /tmp/page.js

      - name: Commit the page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo 'already applied - nothing to commit'; exit 0; fi
          git commit -m "81.8: crop with exact times and the keyboard, and a speed per song"
          git push

      - name: Redeploy Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml
