name: Apply the album-art bridge (hold-to-reorder)

# Hold-to-reorder on an album song throws "scAlbumRowArt is not defined".
# The page is two top-level <script> blocks: the first (an IIFE) owns scAlbumRowArt, the
# second draws the reorder sheet and can only see what the first publishes on window
# (__scGetUserAlbums, __scGetAllTracks, ...). The art lookup was never published.
# One export, one local name, nothing else changed. Run once, then build as usual.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch the page
        run: |
          python3 - <<'PY'
          import io, json, sys
          P = 'index.html'
          s = io.open(P, encoding='utf-8').read()
          if 'window.__scAlbumRowArt' in s:
              print('already applied'); sys.exit(0)
          a1 = "  window.__scGetAllTracks = function(){ return allTracks; };\n"
          if s.count(a1) != 1: sys.exit('FATAL: album bridge anchor missing')
          s = s.replace(a1, a1 + (
              "  // 84.1.1 - the reorder sheet paints its rows with scAlbumRowArt, which lives\n"
              "  // here and was never published on the window bridge, so every hold died with\n"
              "  // \"scAlbumRowArt is not defined\" before drawing a single row.\n"
              "  window.__scAlbumRowArt = function(t){ try{ return scAlbumRowArt(t); }catch(e){ return ''; } };\n"), 1)
          a2 = "document.addEventListener('lostpointercapture',()=>{},true);\n"
          if s.count(a2) != 1: sys.exit('FATAL: second block anchor missing')
          s = s.replace(a2, a2 + (
              "// 84.1.1 - hold-to-reorder drew album rows with scAlbumRowArt, a name that only\n"
              "// exists in the earlier <script> block, so the sheet threw on its first row. No\n"
              "// cover beats a long press that does nothing.\n"
              "function scAlbumRowArt(t){\n"
              "  try{ if(typeof window.__scAlbumRowArt === 'function') return window.__scAlbumRowArt(t); }catch(e){}\n"
              "  return '';\n"
              "}\n"), 1)
          old = "const APP_VERSION = '84.1.0';"
          if s.count(old) != 1: sys.exit('FATAL: page is not on 84.1.0')
          s = s.replace(old, "const APP_VERSION = '84.1.1';", 1)
          io.open(P, 'w', encoding='utf-8').write(s)
          w = io.open('sw.js', encoding='utf-8').read()
          if 'sidecut-shell-v84.1.0' not in w: sys.exit('FATAL: sw not on 84.1.0')
          io.open('sw.js', 'w', encoding='utf-8').write(w.replace('sidecut-shell-v84.1.0', 'sidecut-shell-v84.1.1'))
          u = json.load(io.open('updates.json', encoding='utf-8'))
          u['version'] = '84.1.1'
          u['date'] = 'November 13, 2026'
          u['notes'] = ["Holding a song inside an album opens the reorder sheet again instead of failing with \"scAlbumRowArt is not defined\": the sheet is drawn in a later script than the one that finds a song's cover art, and that lookup was never handed over. A row that cannot find its cover now draws without one rather than killing the press."]
          io.open('updates.json', 'w', encoding='utf-8').write(json.dumps(u, ensure_ascii=False) + '\n')
          print('applied: art lookup published and reachable, page 84.1.1')
          PY

      - name: Check it agrees with itself
        run: |
          python3 - <<'PY'
          import io, json, re, sys
          p = io.open('index.html', encoding='utf-8').read()
          v = re.search(r"const APP_VERSION = '([^']+)'", p).group(1)
          u = json.load(io.open('updates.json', encoding='utf-8'))
          print('page', v, '| updates.json', u['version'], '| notes', len(u['notes']))
          assert v == '84.1.1' and u['version'] == v
          assert p.count('function scAlbumRowArt(') == 2, 'expected two definitions'
          assert p.count('window.__scAlbumRowArt') == 1, 'bridge must be published once'
          assert p.count("\nfunction scAlbumRowArt(t){\n") == 1, 'block-two name missing'
          assert 'sidecut-shell-v84.1.1' in io.open('sw.js', encoding='utf-8').read()
          print('bridge published once, both blocks have the name, version trio agrees')
          PY

      - name: Commit and push
        run: |
          git config user.name 'SideCut'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js updates.json
          if git diff --cached --quiet; then echo 'nothing to commit'; exit 0; fi
          git commit -m 'Hold-to-reorder opens again: the sheet can find a song cover'
          git push
